name: Build and release (1.21.1)

on:
  push:
    branches: [mc-1.21.1]
  pull_request:
    branches: [mc-1.21.1]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MC_VERSION: 1.21.1
      VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      # Minecraft 1.21.1 runs on Java 21
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build

      - name: Collect mod jar
        id: jar
        run: |
          jar="build/libs/Obducted-${MC_VERSION}-${VERSION}.jar"
          test -f "$jar" || { ls -la build/libs; exit 1; }
          echo "path=$jar" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: Obducted-${{ env.MC_VERSION }}-${{ env.VERSION }}
          path: ${{ steps.jar.outputs.path }}

      - name: Publish release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          JAR: ${{ steps.jar.outputs.path }}
        run: |
          tag="mc-${MC_VERSION}-build-${{ github.run_number }}"
          # A re-run of the same workflow run reuses its release
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "$JAR" --clobber
            exit 0
          fi
          gh release create "$tag" "$JAR" \
            --target "${{ github.sha }}" \
            --title "Obducted ${MC_VERSION} build ${{ github.run_number }}" \
            --notes "Automated build of \`${GITHUB_REF_NAME}\` at ${GITHUB_SHA::7} for Minecraft ${MC_VERSION} (NeoForge 21.1.251)." \
            --latest=false
