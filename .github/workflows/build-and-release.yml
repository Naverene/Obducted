name: Build and release (1.7.10)

on:
  push:
    branches: [mc-1.7.10]
  pull_request:
    branches: [mc-1.7.10]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MC_VERSION: 1.7.10
      # The GTNH buildscript uses this instead of deriving the version from git tags
      VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 8 compiles/runs Minecraft, 17 runs Jabel, 25 runs the Gradle daemon (gradle/gradle-daemon-jvm.properties)
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: |
            8
            17
            25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64,JAVA_HOME_17_X64,JAVA_HOME_25_X64

      - name: Collect mod jar
        id: jar
        run: |
          src="build/libs/ob-${VERSION}.jar"
          test -f "$src" || { ls -la build/libs; exit 1; }
          jar="build/libs/Obducted-${MC_VERSION}-${VERSION}.jar"
          cp "$src" "$jar"
          echo "path=$jar" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: Obducted-${{ env.MC_VERSION }}-${{ env.VERSION }}
          path: ${{ steps.jar.outputs.path }}

      - name: Publish release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          JAR: ${{ steps.jar.outputs.path }}
        run: |
          tag="mc-${MC_VERSION}-build-${{ github.run_number }}"
          # A re-run of the same workflow run reuses its release
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "$JAR" --clobber
            exit 0
          fi
          gh release create "$tag" "$JAR" \
            --target "${{ github.sha }}" \
            --title "Obducted ${MC_VERSION} build ${{ github.run_number }}" \
            --notes "Automated build of \`${GITHUB_REF_NAME}\` at ${GITHUB_SHA::7} for Minecraft ${MC_VERSION} (Forge 10.13.4.1614)." \
            --latest=false
